<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Body Factory</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — Rafgraph spa-github-pages
      // https://github.com/rafgraph/spa-github-pages
      // This script redirects 404s back to index.html, preserving the path.
      var pathSegmentsToKeep = 1; // keep /tbf-website/ segment

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
